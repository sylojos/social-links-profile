<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="styles/style.css" />
    <title>Frontend Mentor | Social links profile</title>
  </head>
  <body>
    <main>
      <article class="profile">
        <header class="profile__intro">
          <img
            class="profile__image"
            width="176"
            height="176"
            src="assets/images/avatar-jessica.jpeg"
            alt=""
          />
          <div class="profile__info">
            <h1 class="profile__name">Jessica Randall</h1>
            <p class="profile__location">London, United Kingdom</p>
          </div>
          <p class="profile__bio">"Front-end developer and avid reader."</p>
        </header>
        <ul class="profile__socials">
          <li class="profile__item">
            <a
              class="profile__link profile__link--hover profile__link--focus"
              href="#"
              >GitHub</a
            >
          </li>
          <li class="profile__item">
            <a
              class="profile__link profile__link--hover profile__link--focus"
              href="#"
              >Frontend Mentor</a
            >
          </li>
          <li class="profile__item">
            <a
              class="profile__link profile__link--hover profile__link--focus"
              href="#"
              >LinkedIn</a
            >
          </li>
          <li class="profile__item">
            <a
              class="profile__link profile__link--hover profile__link--focus"
              href="#"
              >Twitter</a
            >
          </li>
          <li class="profile__item">
            <a
              class="profile__link profile__link--hover profile__link--focus"
              href="#"
              >Instagram</a
            >
          </li>
        </ul>
      </article>
    </main>
  </body>
</html>
